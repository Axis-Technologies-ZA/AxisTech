<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 692" role="img" aria-labelledby="title description">
  <title id="title">AxisOS 2.0 boot screen</title>
  <desc id="description">A black startup screen with the Axis triangle logo in mint green, Debian Bookworm and Cinnamon labels, and a loading indicator.</desc>
  <defs>
    <radialGradient id="screenGlow">
      <stop offset="0" stop-color="#142618" />
      <stop offset="1" stop-color="#0a0e0b" />
    </radialGradient>
    <linearGradient id="axisGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#87cf3e" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
    <filter id="logoGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>
  <rect width="1232" height="692" fill="#0a0e0b" />
  <ellipse cx="616" cy="327" rx="200" ry="190" fill="url(#screenGlow)" />
  <path d="M616 293 590 342h52z" fill="none" stroke="#87cf3e" stroke-width="24" stroke-linejoin="round" opacity=".35" filter="url(#logoGlow)" />
  <path d="M616 293 590 342h52z" fill="none" stroke="url(#axisGreen)" stroke-width="7" stroke-linejoin="round" />
  <path d="M616 309 601 338h30z" fill="none" stroke="#87cf3e" stroke-width="4.5" stroke-linejoin="round" opacity=".95" />
  <circle cx="616" cy="325" r="4.5" fill="#ffffff" />
  <text x="616" y="386" fill="#ffffff" font-family="'Space Grotesk', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">AxisOS 2.0</text>
  <text x="616" y="411" fill="#87cf3e" font-family="'DM Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="2" text-anchor="middle">DEBIAN BOOKWORM  •  CINNAMON &amp; WAYLAND</text>
  <rect x="516" y="447" width="200" height="4" rx="2" fill="#1b281e" />
  <rect x="516" y="447" width="130" height="4" rx="2" fill="#87cf3e" />
</svg>